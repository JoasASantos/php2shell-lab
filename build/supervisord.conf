[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:mariadb]
command=/usr/bin/mariadbd-safe --datadir=/var/lib/mysql
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:apache]
command=apache2-foreground
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:hooks]
command=python3 /opt/hooks_server.py
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
